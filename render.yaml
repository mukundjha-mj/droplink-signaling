services:
  - type: web
    name: droplink-signaling
    runtime: node
    plan: free
    rootDir: apps/signaling
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: DROPLINK_REGISTRY_JSON
        sync: false
      - key: DROPLINK_STUN_URLS
        value: stun:stun.cloudflare.com:3478
      - key: DROPLINK_WEB_RELAY
        value: "1"
      - key: DROPLINK_RELAY_DAILY_BYTES
        value: "67108864"
